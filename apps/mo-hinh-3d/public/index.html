<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MdFlex — mô hình công ty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: mô hình kiến trúc chiếm toàn màn, bảng 3 tab bên phải. Token lấy từ bộ nhận diện MdFlex (config/thuong-hieu.json) */
:root{
  --bg:#ffffff; --surface:#f5f5f5; --panel:#ffffff; --line:#e0e0e0; --ink:#1a1a2e; --quiet:#444444; --faint:#666666;
  --accent:#149078; --accent-hover:#0d6b56; --accent-soft:#e8f5f1; --accent-ink:#ffffff;
  --brand-accent:#f48c0c; --brand-accent-soft:#fef3e2;
  --ok:#22c55e; --warn:#f59e0b; --err:#ef4444; --info:#3b82f6;
  --scene-bg:#ffffff; --plinth:#f5f5f5; --plinth-edge:#e0e0e0; --building:#ffffff; --road:#e0e0e0; --ai:#2dd4a8;
  --c-kd:#149078; --c-mkt:#f48c0c; --c-pt:#3b82f6; --c-kt:#0d6b56; --c-ns:#444444; --c-ceo:#1a1a2e;
  --warn-bg:#fef3e2;
  --f-display:"DM Sans",system-ui,"Segoe UI",sans-serif;
  --f-body:"Inter",system-ui,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r-btn:8px; --r-card:12px; --r-modal:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f172a; --surface:#1e293b; --panel:#0f172a; --line:#334155; --ink:#f1f5f9; --quiet:#e0e0e0; --faint:#e0e0e0;
  --accent:#2dd4a8; --accent-hover:#149078; --accent-soft:#1e293b; --accent-ink:#0f172a;
  --brand-accent:#fbb040; --brand-accent-soft:#1e293b;
  --scene-bg:#0f172a; --plinth:#1e293b; --plinth-edge:#334155; --building:#1e293b; --road:#334155; --ai:#2dd4a8;
  --c-kd:#2dd4a8; --c-mkt:#fbb040; --c-pt:#3b82f6; --c-kt:#149078; --c-ns:#e0e0e0; --c-ceo:#f1f5f9;
  --warn-bg:#1e293b; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f172a; --surface:#1e293b; --panel:#0f172a; --line:#334155; --ink:#f1f5f9; --quiet:#e0e0e0; --faint:#e0e0e0;
  --accent:#2dd4a8; --accent-hover:#149078; --accent-soft:#1e293b; --accent-ink:#0f172a;
  --brand-accent:#fbb040; --brand-accent-soft:#1e293b;
  --scene-bg:#0f172a; --plinth:#1e293b; --plinth-edge:#334155; --building:#1e293b; --road:#334155; --ai:#2dd4a8;
  --c-kd:#2dd4a8; --c-mkt:#fbb040; --c-pt:#3b82f6; --c-kt:#149078; --c-ns:#e0e0e0; --c-ceo:#f1f5f9;
  --warn-bg:#1e293b; color-scheme:dark;}

html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;overflow:hidden}
*{box-sizing:border-box}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.2}
.app{display:grid;grid-template-columns:minmax(0,1fr) 440px;grid-template-rows:auto minmax(0,1fr);height:100%}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:var(--r-btn);background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:700;font-size:16px;flex:none}
.brand h1{margin:0;font-size:18px;font-weight:700}
.brand span{font-size:12px;color:var(--quiet)}
.stages{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.stage{font:inherit;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--ink);min-height:44px;
  padding:4px 12px;border-radius:var(--r-btn);cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;line-height:1.25}
.stage small{font-family:var(--f-mono);font-size:12px;font-weight:400;color:var(--quiet)}
.stage:hover{border-color:var(--accent)}
.stage[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stage[aria-pressed="true"] small{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.stagewrap{position:relative;min-height:0;overflow:hidden;background:var(--scene-bg)}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-size:12px;font-weight:600;
  background:var(--panel);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--c,var(--ink));
  padding:2px 8px;border-radius:var(--r-btn)}
.lbl small{font-family:var(--f-mono);font-weight:400;color:var(--quiet);margin-left:4px;font-size:12px}
.lbl.team{font-weight:500}
.lbl.ai{border-left-color:var(--ai)}
.lbl.dim{opacity:.35}
.lbl em{display:block;font-style:normal;font-weight:500;font-size:11px;color:var(--quiet);margin-top:1px}
.lbl em.busy{color:var(--accent)} .lbl em.stuck{color:var(--err)} .lbl em.ceo{color:var(--brand-accent)}
/* Luồng việc */
.wk-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:8px 0 4px}
.wk-sum div{border:1px solid var(--line);border-radius:var(--r-card);padding:8px;background:var(--surface)}
.wk-sum b{display:block;font-family:var(--f-mono);font-size:18px}
.wk-sum span{font-size:12px;color:var(--quiet)}
.wk-dept{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:var(--r-card);padding:12px;margin:8px 0;background:var(--panel)}
.wk-dept header{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wk-dept header b{font-size:15px;cursor:pointer}
.st{font-size:12px;padding:0 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.st.idle{color:var(--quiet);border-style:dashed} .st.busy{border-color:var(--accent);color:var(--accent)} .st.stuck{border-color:var(--err);color:var(--err)} .st.ceo{border-color:var(--brand-accent)} .st.wait{border-color:var(--faint)}
.wk-item{border-top:1px solid var(--line);margin-top:8px;padding-top:8px;font-size:13px}
.wk-item .mono{font-family:var(--f-mono);font-size:12px}
.wk-steps{display:flex;gap:2px;margin:6px 0 4px}
.wk-steps i{flex:1;height:6px;border-radius:2px;background:var(--line)}
.wk-steps i.on{background:var(--accent)} .wk-steps i.cur{background:var(--brand-accent)}
.wk-meta{font-size:12px;color:var(--quiet)}
.wk-meta .err{color:var(--err)}
.wk-chain{font-size:12px;margin-top:4px}
.wk-chain span{white-space:nowrap}
@media (max-width:640px){ .wk-sum{grid-template-columns:repeat(2,minmax(0,1fr))} }
.hud{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:12px;display:flex;flex-direction:column;gap:8px;max-width:calc(100% - 24px)}
.stats{display:flex;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);padding:8px 12px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--f-mono);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--quiet)}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:12px;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--ink);min-height:32px;padding:4px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ai);margin-right:4px}
.legend{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;display:flex;gap:12px;flex-wrap:wrap;
  font-size:12px;color:var(--quiet);background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);padding:8px 12px;max-width:calc(100% - 24px)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:4px;vertical-align:-1px}
.hint{position:absolute;right:12px;bottom:12px;font-size:12px;color:var(--faint)}

aside{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 16px;gap:4px;overflow-x:auto}
.tab{font:inherit;font-family:var(--f-display);font-weight:600;font-size:14px;background:none;border:0;border-bottom:2px solid transparent;color:var(--quiet);padding:12px 8px;min-height:44px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pane{overflow-y:auto;padding:16px 20px 32px;min-height:0;flex:1}
.pane h2{font-size:22px;font-weight:600;margin:0 0 4px;text-wrap:balance}
.pane h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--quiet);margin:24px 0 8px;font-weight:600;font-family:var(--f-body)}
.pane p{margin:0 0 8px}
.sub{color:var(--quiet);font-size:14px;margin-bottom:12px}
.back{font:inherit;font-size:14px;background:none;border:0;color:var(--accent);padding:0;min-height:32px;cursor:pointer;margin-bottom:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--quiet)} .kv dd{margin:0}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:4px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--quiet);font-size:12px}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.deptrow{cursor:pointer} .deptrow:hover td{background:var(--surface)}
.sw{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:8px;vertical-align:-1px}
ul.plain{margin:0;padding-left:20px} ul.plain li{margin-bottom:4px}
.tag{display:inline-block;font-size:12px;padding:0 8px;border-radius:999px;border:1px dashed var(--faint);color:var(--quiet);margin-left:4px}
.note{font-size:14px;background:var(--warn-bg);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--brand-accent);padding:8px 12px;border-radius:var(--r-card);margin:12px 0}
.note.err{border-left-color:var(--err)}
.note.ok{border-left-color:var(--ok)}
.gate{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r-card);padding:12px;background:var(--surface);font-size:14px}
.gate b{font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.phase{margin-top:20px}
.phase h4{margin:0 0 8px;font-size:16px;display:flex;justify-content:space-between;gap:8px}
.phase h4 span{font-family:var(--f-mono);font-size:12px;color:var(--quiet);font-weight:400;white-space:nowrap}
.check{display:grid;grid-template-columns:20px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:start}
.check input{margin:4px 0 0;width:16px;height:16px;accent-color:var(--accent)}
.check label{cursor:pointer}
.check small{display:block;color:var(--quiet);font-size:12px}
.check input:checked + label{color:var(--quiet);text-decoration:line-through}
.progress{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:8px 0 4px}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.owner{font-family:var(--f-mono);font-size:12px;color:var(--quiet);white-space:nowrap}

/* Canvas 9 thành tố */
.vision{border-radius:var(--r-card);background:var(--accent);color:var(--accent-ink);padding:16px;margin-bottom:12px}
.vision h4{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-family:var(--f-body)}
.vision p{margin:0 0 12px;font-family:var(--f-display);font-size:16px;font-weight:500;line-height:1.35}
.vision p:last-child{margin-bottom:0}
.vision small{display:block;font-size:12px;opacity:.85;font-family:var(--f-body);font-weight:400}
.goals{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.goal{border:1px solid var(--line);border-radius:var(--r-card);padding:8px 12px;font-size:12px;background:var(--surface)}
.goal b{display:block;font-family:var(--f-mono);color:var(--accent);font-size:12px}
.bmc{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));grid-auto-rows:minmax(64px,auto);gap:4px;margin:8px 0}
.bmc-cell{border:1px solid var(--line);border-radius:var(--r-btn);background:var(--panel);padding:8px;cursor:pointer;text-align:left;font:inherit;color:var(--ink);display:flex;flex-direction:column;gap:4px;min-width:0}
.bmc-cell:hover{border-color:var(--accent)}
.bmc-cell.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.bmc-cell h4{margin:0;font-size:12px;font-weight:600;font-family:var(--f-body);line-height:1.25}
.bmc-cell h4 em{font-style:normal;font-family:var(--f-mono);color:var(--quiet);margin-right:4px}
.owners{display:flex;gap:4px;flex-wrap:wrap;margin-top:auto}
.owner-chip{white-space:nowrap;font-size:12px;line-height:1;padding:4px 8px;border-radius:999px;border:1px solid var(--c);color:var(--ink)}
.owner-chip.a{background:var(--c);color:var(--bg);font-weight:600;border-color:var(--c)}
.c-kp{grid-column:1/3;grid-row:1/3}.c-ka{grid-column:3/5;grid-row:1}.c-kr{grid-column:3/5;grid-row:2}
.c-vp{grid-column:5/7;grid-row:1/3}.c-cr{grid-column:7/9;grid-row:1}.c-ch{grid-column:7/9;grid-row:2}
.c-cs{grid-column:9/11;grid-row:1/3}.c-co{grid-column:1/6;grid-row:3}.c-rs{grid-column:6/11;grid-row:3}
.block-detail{border:1px solid var(--line);border-radius:var(--r-card);padding:12px;margin-top:8px}
.block-detail h4{margin:0 0 4px;font-size:18px;font-weight:500}
.badge{display:inline-block;font-size:12px;padding:0 8px;border-radius:999px;background:var(--brand-accent-soft);color:var(--ink);border:1px solid var(--brand-accent);margin-left:8px;font-family:var(--f-body);font-weight:500}
.matrix td.a{font-weight:700;color:var(--accent);text-align:center}
.matrix td.p{color:var(--quiet);text-align:center}
.matrix th.v{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;text-align:left;padding:8px 4px;font-weight:500}
.fn{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:var(--r-card);padding:12px;margin-bottom:8px}
.fn h4{margin:0 0 4px;font-size:16px;font-weight:600}
.fn p{font-size:14px}
.fn ul{margin:4px 0 8px;padding-left:20px;font-size:14px}
.fn .goal-line{font-size:12px;color:var(--quiet)}

/* Thiết kế AI */
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:14px;font-weight:500}
.field small{font-size:12px;color:var(--quiet)}
select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:var(--r-btn);padding:8px 12px;min-height:44px}
textarea{min-height:120px;resize:vertical;line-height:1.5}
select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--accent-soft)}
.btn{font:inherit;font-size:14px;font-weight:600;border-radius:var(--r-btn);border:1px solid var(--line);background:var(--panel);color:var(--ink);min-height:44px;padding:8px 16px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;margin:8px 0}
.swatch{border:1px solid var(--line);border-radius:var(--r-btn);overflow:hidden;font-size:12px}
.swatch i{display:block;height:32px}
.swatch span{display:block;padding:4px 8px;font-family:var(--f-mono)}
.examples{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.examples button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;min-height:32px;cursor:pointer}
.result{border:1px solid var(--line);border-radius:var(--r-card);padding:12px;margin-top:12px}
.result h4{margin:0 0 4px;font-size:16px;display:flex;justify-content:space-between;gap:8px}
.result h4 span{font-family:var(--f-mono);font-size:12px;color:var(--quiet);font-weight:400}
pre.code{font-family:var(--f-mono);font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-btn);padding:8px 12px;max-height:240px;overflow:auto;white-space:pre}
.pass{color:var(--ok);font-weight:600} .fail{color:var(--err);font-weight:600}
.status{font-size:12px;display:flex;align-items:center;gap:8px;color:var(--quiet);margin-bottom:12px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--err)}
.status.on i{background:var(--ok)}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--accent-soft);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:900px){
  body{overflow:auto}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 60vh auto;height:auto}
  aside{border-left:0;border-top:1px solid var(--line)}
  .pane{overflow:visible}
  .stages{margin-left:0}
  .hint{display:none}
}
@media (max-width:520px){ .stat b{font-size:16px} .stats{gap:12px} .legend{display:none} .goals{grid-template-columns:1fr}
  .bmc{grid-template-columns:1fr 1fr} .bmc>*{grid-column:auto!important;grid-row:auto!important} }
@media (prefers-reduced-motion: reduce){ .progress i{transition:none} .spinner{animation:none} }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">Md</div>
      <div><h1>MdFlex — mô hình công ty</h1>
      <span>Phần mềm y tế cho phòng khám · 5 phòng · 15 tổ · lớp AI điều phối</span></div>
    </div>
    <div class="stages" id="stages" role="group" aria-label="Chọn mốc"></div>
    <a class="stage" href="/giao-viec.html" style="text-decoration:none;border-color:var(--accent)">Giao việc<small>CEO · tự động</small></a>
    <a class="stage" href="/dieu-hanh.html" style="text-decoration:none;border-color:var(--accent)">Buồng điều hành<small>mục tiêu · đánh giá</small></a>
    <a class="stage" href="/ceo.html"style="text-decoration:none;border-color:var(--accent)">Bảng CEO<small>điều hành · duyệt</small></a>
    <a class="stage" href="/phong.html"style="text-decoration:none;border-color:var(--accent)">Phòng làm việc<small>5 phòng · phiếu việc</small></a>
    <a class="stage" href="/toa-nha.html" style="text-decoration:none;border-color:var(--accent)">Toà nhà 7 tầng<small>bản nháp 02</small></a>
  </header>

  <div class="stagewrap" id="wrap">
    <canvas id="scene" aria-label="Mô hình 3D cơ cấu tổ chức MdFlex"></canvas>
    <div id="labels"></div>
    <div class="hud">
      <div class="stats" id="stats"></div>
      <div class="toggles">
        <button class="chip" id="tAI" aria-pressed="true"><span class="dot"></span>Lớp AI</button>
        <button class="chip" id="tFlow" aria-pressed="true">Luồng bàn giao</button>
        <button class="chip" id="tSpin" aria-pressed="false">Tự xoay</button>
      </div>
    </div>

const bodyGeo=new THREE.CylinderGeometry(0.17,0.22,0.62,10); bodyGeo.translate(0,0.31,0);
const headGeo=new THREE.SphereGeometry(0.17,12,10); headGeo.translate(0,0.82,0);
const pMat=new THREE.MeshStandardMaterial({roughness:.7});
people.bodies=new THREE.InstancedMesh(bodyGeo,pMat,people.max); people.heads=new THREE.InstancedMesh(headGeo,pMat,people.max);
people.bodies.castShadow=people.heads.castShadow=true;
if(people.bodies.instanceColor===null){ people.bodies.setColorAt(0,new THREE.Color()); people.heads.setColorAt(0,new THREE.Color()); }
scene.add(people.bodies,people.heads);
const pState=[]; // {x,z,y,target,scale,color}

function layoutPeople(){
  const list=[];
  const ceoC=C().ceo;
  list.push({x:0,z:0,y:6.08,col:ceoC,key:"ceo"});
  DEPTS.forEach(d=>{
    const col=css(d.color);
    if(d.headN[stage]){ const p=d.pos.clone().add(d.u.clone().multiplyScalar(-3.6)); list.push({x:p.x,z:p.z,y:0,col,key:d.id+"-head"}); }
    d.teams.forEach((tm,j)=>{
      const n=teamN(tm,stage);
      for(let k=0;k<n;k++){
        const row=Math.floor(k/5), c=k%5;
        const p=tm.pos.clone().add(d.u.clone().multiplyScalar(2.5+row*0.62)).add(d.t.clone().multiplyScalar((c-2)*0.6));
        list.push({x:p.x,z:p.z,y:0,col,key:d.id+"-"+j+"-"+k});
      }
    });
  });
  // giữ vị trí cũ theo key để người cũ không nhảy
  const prev=new Map(pState.map(p=>[p.key,p]));
  pState.length=0;
  list.forEach(p=>{ const o=prev.get(p.key); pState.push(Object.assign(p,{s:o?o.s:0})); });
  return list.length;
}
const _m=new THREE.Matrix4(), _q=new THREE.Quaternion(), _v=new THREE.Vector3(), _sc=new THREE.Vector3(), _c=new THREE.Color();
function drawPeople(dt){
  const n=Math.min(pState.length,people.max);
  for(let i=0;i<n;i++){
    const p=pState[i]; p.s+= (1-p.s)*Math.min(1,dt*(reduce?60:5));
    const dim=p.key!=="ceo" && (selected? !p.key.startsWith(selected.id+"-") : (hlSet? !hlSet.has(p.key.split("-")[0]) : false));
    _v.set(p.x,p.y,p.z); _sc.setScalar(Math.max(.001,p.s)); _m.compose(_v,_q,_sc);
    people.bodies.setMatrixAt(i,_m); people.heads.setMatrixAt(i,_m);
    _c.set(p.col); if(dim) _c.lerp(new THREE.Color(C().plinth),.7);
    people.bodies.setColorAt(i,_c); people.heads.setColorAt(i,_c);
  }
  people.bodies.count=people.heads.count=n;
  people.bodies.instanceMatrix.needsUpdate=people.heads.instanceMatrix.needsUpdate=true;
  if(people.bodies.instanceColor){people.bodies.instanceColor.needsUpdate=people.heads.instanceColor.needsUpdate=true;}
}

const flowGroup=new THREE.Group(); scene.add(flowGroup);
const flowObjs=[];
function buildFlows(){
  flowGroup.clear(); flowObjs.length=0;
  FLOWS.forEach((f,fi)=>{
    const sources=f[0]==="*"?DEPTS.filter(d=>d.id!==f[1]).map(d=>d.id):[f[0]];
    sources.forEach((sid,si)=>{
      const a=deptById(sid), b=deptById(f[1]); const support=f[0]==="*";
      const lift=FLOWS.slice(0,fi).filter(g=>g[0]===f[0]&&g[1]===f[1]).length*2.5; // tách các luồng trùng cặp
      const pa=a.pos.clone(); pa.y=a.h+0.6; const pb=b.pos.clone(); pb.y=b.h+0.6;
      const mid=pa.clone().lerp(pb,.5); mid.y=Math.max(pa.y,pb.y)+(support?3:6)+lift;
      const curve=new THREE.QuadraticBezierCurve3(pa,mid,pb);
      const col=new THREE.Color(css(a.color));
      const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(48)),new THREE.LineBasicMaterial({color:col,transparent:true,opacity:support?.22:.55}));
      flowGroup.add(line);
      const dot=new THREE.Mesh(new THREE.SphereGeometry(support?.16:.24,10,8),new THREE.MeshBasicMaterial({color:col,transparent:true}));
      flowGroup.add(dot);
      flowObjs.push({curve,dot,line,off:(fi*0.17+si*0.21)%1,speed:support?.09:.16,a:sid,b:f[1]});
    });
  });
}

  DEPTS.forEach(d=>{
    d.h+=(d.hTarget-d.h)*k; d.main.scale.y=d.h; d.main.position.y=d.h/2; d.cap.position.y=d.h+0.16;
    d.teams.forEach(tm=>{ tm.h+=(tm.hTarget-tm.h)*k; tm.mesh.scale.y=tm.h; tm.mesh.position.y=tm.h/2; tm.wire.scale.y=tm.h; tm.wire.position.y=tm.h/2; tm.stripe.position.y=tm.h+0.09; });
    if(d.agent){ d.agent.position.set(d.pos.x,d.h+2.6+(reduce?0:Math.sin(tAcc*1.6+d.ang)*.25),d.pos.z); d.agent.rotation.y+=reduce?0:dt; }
  });
  if(!reduce){ halo.rotation.z+=dt*.25; halo2.rotation.z-=dt*.15; qa.rotation.y+=dt*.8; }
  if(flowGroup.visible) flowObjs.forEach(f=>{ const tt=(f.off+(reduce?0:tAcc*f.speed))%1; f.dot.position.copy(f.curve.getPoint(tt)); });
  drawPeople(dt);
  if(controls){
    if(focusTarget){ controls.target.lerp(focusTarget,reduce?1:.08); if(controls.target.distanceTo(focusTarget)<.05) focusTarget=null; }
    controls.update();
  }
  if(renderer) renderer.render(scene,camera);
  placeLabels();
  requestAnimationFrame(frame);
}

/* ============ LUỒNG VIỆC: phòng nào rảnh, đang làm gì, tới đâu, báo cáo về ai ============ */
const BUOC=["Mới","Đã nhận","Đang làm","Chờ nghiệm thu","Chờ CEO duyệt","Xong"];
const BUOC_TEN=["Chờ nhận","Đã nhận","Đang làm","Chờ Trưởng phòng nghiệm thu","Chờ CEO duyệt","Xong"];
async function taiViec(){
  try{
    const [p,c]=await Promise.all([fetch("/api/phieu"),WORK.cfg?null:fetch("/api/phong")]);
    if(!p.ok) throw 0; WORK.list=await p.json(); if(c&&c.ok) WORK.cfg=await c.json(); WORK.loi="";
  }catch(e){ WORK.loi="Không đọc được phiếu việc (/api/phieu)."; }
  tinhViec(); refreshLabels(); renderWork(); if(selected) renderOrg();
}
function tenVT(m){
  const C=WORK.cfg; if(!C) return m;
  const v=C.vi_tri_chung.find(x=>x.ma===m); if(v) return v.ten;
  for(const p of C.phong){ if(p.truong_phong.ai.ma===m) return p.truong_phong.ai.ten; for(const t of p.to) for(const a of t.ai) if(a.ma===m) return a.ten; }
  return m;
}
// Chuỗi báo cáo của một phiếu: người làm → người giao → … → CEO (theo phiếu cha)
function chuoiBaoCao(x){
  const by=WORK.by, ch=[x.nguoi_nhan]; let cur=x;
  while(cur){ if(!ch.includes(cur.nguoi_giao)) ch.push(cur.nguoi_giao); cur=by[cur.phieu_cha]; }
  return ch;
}
function tinhViec(){
  const L=WORK.list||[], by=WORK.by=Object.fromEntries(L.map(x=>[x.ma,x]));
  const dong=x=>x.trang_thai==="Xong"||x.trang_thai==="Đã ngừng";
  const con=ma=>L.filter(x=>x.phieu_cha===ma&&x.loai!=="Đề xuất"&&x.trang_thai!=="Đã ngừng");
  WORK.phong={};
  DEPTS.forEach(d=>{
    const mine=L.filter(x=>x.phong===d.id), mo=mine.filter(x=>!dong(x));
    // Việc của phòng = phiếu cao nhất trong phòng (phiếu Trưởng phòng nhận, hoặc phiếu lẻ không có cha trong phòng)
    const goc=mo.filter(x=>!(by[x.phieu_cha]&&by[x.phieu_cha].phong===d.id));
    const viec=goc.map(g=>{
      const la=con(g.ma).length?con(g.ma):[g];
      const buoc=Math.min(...la.map(x=>Math.max(0,BUOC.indexOf(x.trang_thai==="Vướng"?"Đang làm":x.trang_thai))));
      const xong=la.filter(x=>x.trang_thai==="Xong").length;
      return {g,la,buoc,xong,vuong:la.some(x=>x.trang_thai==="Vướng")||g.trang_thai==="Vướng",ai:la.some(x=>x.ai_dang_lam),ceo:la.some(x=>x.trang_thai==="Chờ CEO duyệt")};
    });
    let cls="idle",nhan="rảnh";
    if(viec.some(v=>v.vuong)){cls="stuck";nhan=`vướng · ${viec.length} việc`;}
    else if(viec.some(v=>v.ceo)){cls="ceo";nhan=`chờ CEO · ${viec.length} việc`;}
    else if(viec.some(v=>v.buoc>=2)){cls="busy";nhan=`đang làm ${viec.length} việc`;}
    else if(viec.length){cls="wait";nhan=viec.every(v=>v.buoc===0)?`${viec.length} việc chờ nhận`:`${viec.length} việc đã nhận, chưa bắt đầu`;}
    WORK.phong[d.id]={cls,nhan,viec,xongTuan:mine.filter(x=>x.trang_thai==="Xong"&&Date.now()-Date.parse(x.xong_luc||0)<7*864e5).length,quaHan:mo.filter(x=>x.qua_han).length};
  });
  WORK.goc=L.filter(x=>x.nguoi_giao==="CEO"&&x.nguoi_nhan==="TL-DP"&&!dong(x));
}
function theViec(v){
  const g=v.g, ch=chuoiBaoCao(v.la[0]);
  const pct=v.la.length?Math.round(v.xong/v.la.length*100):0;
  const han=new Date(g.han).toLocaleString("vi-VN",{hour:"2-digit",minute:"2-digit",day:"2-digit",month:"2-digit"});
  return `<div class="wk-item"><div><span class="mono">${esc(g.ma)}</span> ${esc(g.muc_tieu)}</div>
    <div class="wk-steps" role="img" aria-label="Bước ${v.buoc+1}/6: ${esc(BUOC_TEN[v.buoc])}">${BUOC.map((_,i)=>`<i class="${i<v.buoc?"on":i===v.buoc?"cur":""}"></i>`).join("")}</div>
    <div class="wk-meta">${esc(BUOC_TEN[v.buoc])}${v.vuong?' · <span class="err">Vướng</span>':""}${v.ai?" · Claude đang làm":""} · ${v.xong}/${v.la.length} phiếu thực hiện xong (${pct}%) · ${g.qua_han?'<span class="err">quá hạn</span>':"hạn"} ${han}</div>
    <div class="wk-meta">Người làm: ${v.la.map(x=>`<span class="mono">${esc(x.nguoi_nhan)}</span>`).join(", ")}</div>
    <div class="wk-chain">Báo cáo về: ${ch.slice(1).map(m=>`<span>${esc(tenVT(m))}</span>`).join(" → ")}${v.la.some(x=>x.ket_qua_ai)?" · kết quả AI lưu ở data/ket-qua/":""}</div></div>`;
}
function renderWork(){
  const el=$("#paneWork"); if(!el) return;
  if(WORK.loi){ el.innerHTML=`<h2>Luồng việc</h2><div class="note err">${esc(WORK.loi)}</div>`; return; }
  const P=WORK.phong, ds=DEPTS.map(d=>[d,P[d.id]]);
  const ranh=ds.filter(([,w])=>w.cls==="idle").length, lam=ds.length-ranh, vuong=ds.filter(([,w])=>w.cls==="stuck").length;
  const goc=WORK.goc||[];
  const thu=["stuck","ceo","busy","wait","idle"];
  el.innerHTML=`<h2>Luồng việc của công ty</h2>
    <p class="sub">Cập nhật mỗi 20 giây từ phiếu việc. Việc đi: CEO → Trợ lý điều phối → Trưởng phòng → Chuyên viên. Kết quả báo ngược lại: Chuyên viên → Trưởng phòng nghiệm thu → Trợ lý cộng dồn → CEO nghiệm thu.</p>
    <div class="wk-sum"><div><b>${lam}</b><span>phòng có việc</span></div><div><b>${ranh}</b><span>phòng rảnh</span></div><div><b>${vuong}</b><span>phòng vướng</span></div><div><b>${goc.length}</b><span>việc CEO đang chạy</span></div></div>
    ${ds.slice().sort((a,b)=>thu.indexOf(a[1].cls)-thu.indexOf(b[1].cls)).map(([d,w])=>`<section class="wk-dept" style="--c:var(${d.color})">
      <header><b data-phong="${d.id}" role="button" tabindex="0">${esc(d.short||d.name)}</b><span class="st ${w.cls}">${esc(w.nhan)}</span>${w.quaHan?`<span class="st stuck">${w.quaHan} quá hạn</span>`:""}
        <a href="/phong.html?id=${d.id}" style="margin-left:auto;font-size:12px">Mở phòng →</a></header>
      ${w.viec.length?w.viec.map(theViec).join(""):`<p class="wk-meta" style="margin:6px 0 0">Không có việc đang mở${w.xongTuan?` · ${w.xongTuan} phiếu xong trong 7 ngày`:""}. Có thể nhận việc mới.</p>`}</section>`).join("")}
    <h3>Việc CEO đã giao đang chạy</h3>
    ${goc.length?`<table><thead><tr><th>Phiếu</th><th>Phòng</th><th>Trạng thái</th></tr></thead><tbody>${goc.map(g=>{ const nh=(WORK.list||[]).filter(x=>x.phieu_cha===g.ma&&x.nguoi_giao==="TL-DP");
      return `<tr><td><span class="mono">${esc(g.ma)}</span> ${esc(g.muc_tieu)}</td><td>${nh.map(x=>`${esc((DEPTS.find(d=>d.id===x.phong)||{}).short||x.phong)} <small style="color:var(--quiet)">${esc(x.trang_thai)}</small>`).join("<br>")||(g.cho_dinh_tuyen?"Chờ chọn phòng":"—")}</td><td>${esc(g.trang_thai)}</td></tr>`; }).join("")}</tbody></table>`:'<p class="sub">Chưa có việc CEO giao đang chạy.</p>'}
    <p style="margin-top:12px"><a href="/giao-viec.html">Giao việc mới →</a> · <a href="/ceo.html">Bảng CEO →</a></p>`;
  el.querySelectorAll("[data-phong]").forEach(b=>{ const go=()=>select(deptById(b.dataset.phong)); b.addEventListener("click",go); b.addEventListener("keydown",e=>{ if(e.key==="Enter") go(); }); });
}

/* ============ TAB ============ */
const TABS={org:["#tabOrg","#paneOrg"],work:["#tabWork","#paneWork"],canvas:["#tabCanvas","#paneCanvas"],design:["#tabDesign","#paneDesign"],found:["#tabFound","#paneFound"]};
function showTab(which){ Object.entries(TABS).forEach(([k,[t,p]])=>{ $(t).setAttribute("aria-selected",String(k===which)); $(p).hidden=k!==which; }); }
Object.entries(TABS).forEach(([k,[t]])=>$(t).addEventListener("click",()=>showTab(k)));
loadCanvas(); loadDesign(); taiViec(); setInterval(()=>{ if(!document.hidden) taiViec(); },20000);

/* Theo dõi đổi theme */
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{applyTheme();setDim();});
new MutationObserver(()=>{applyTheme();setDim();}).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

/* Tiêu đề và tab theo cơ cấu (MdFlex giữ nguyên chữ trong HTML) */
if(!LA_MDFLEX){
  const nTo=DEPTS.reduce((a,d)=>a+d.teams.length,0);
  $(".brand h1").textContent=CO.ten+" — mô hình tổ chức";
  $(".brand h1+span").textContent=(CO.khau_hieu?CO.khau_hieu+" · ":"")+DEPTS.length+" phòng · "+nTo+" tổ · lớp AI điều phối";
  $(".logo").textContent=CO.ten.split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
  $("#scene").setAttribute("aria-label","Mô hình 3D cơ cấu tổ chức "+CO.ten);
  const pl=document.querySelector('a.stage[href="/phong.html"] small'); if(pl) pl.textContent=DEPTS.length+" phòng · phiếu việc";
  $("#tabFound").hidden=true;
}

/* Khởi động */
applyTheme(); applyStage(); renderFound(); setDim(); resize();
// dựng flows lần nữa khi chiều cao toà nhà đã ổn định
setTimeout(()=>{buildFlows(); flowGroup.visible=$("#tFlow").getAttribute("aria-pressed")==="true"; setDim();}, reduce?0:1400);
document.querySelectorAll(".stage").forEach(()=>{});
requestAnimationFrame(frame);
// đổi mốc thì luồng bám theo chiều cao mới
$("#stages").addEventListener("click",()=>setTimeout(()=>{buildFlows(); flowGroup.visible=$("#tFlow").getAttribute("aria-pressed")==="true"; setDim();}, reduce?0:1200));
})();
</script>
