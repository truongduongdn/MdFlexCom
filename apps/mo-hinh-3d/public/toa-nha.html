<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Toà nhà MdFlexCom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Token theo config/thuong-hieu.json. Màu cảnh 3D lấy từ /toa-nha/dac-ta-canh.json */
:root{
  --bg:#ffffff; --surface:#f5f5f5; --line:#e0e0e0; --ink:#1a1a2e; --quiet:#444444;
  --accent:#149078; --accent-hover:#0d6b56; --accent-soft:#e8f5f1; --accent-ink:#ffffff;
  --brand-accent:#f48c0c; --brand-accent-soft:#fef3e2;
  --f-display:"DM Sans",system-ui,"Segoe UI",sans-serif;
  --f-body:"Inter",system-ui,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r-btn:8px; --r-card:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f172a; --surface:#1e293b; --line:#334155; --ink:#f1f5f9; --quiet:#e0e0e0;
  --accent:#2dd4a8; --accent-hover:#149078; --accent-soft:#1e293b; --accent-ink:#0f172a;
  --brand-accent:#fbb040; --brand-accent-soft:#1e293b; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f172a; --surface:#1e293b; --line:#334155; --ink:#f1f5f9; --quiet:#e0e0e0;
  --accent:#2dd4a8; --accent-hover:#149078; --accent-soft:#1e293b; --accent-ink:#0f172a;
  --brand-accent:#fbb040; --brand-accent-soft:#1e293b; color-scheme:dark;}

html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;overflow:hidden}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);line-height:1.2}
.app{display:grid;grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto minmax(0,1fr);height:100%}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:var(--r-btn);background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:700;font-size:16px;flex:none}
.brand h1{margin:0;font-size:18px;font-weight:700}
.brand span{font-size:12px;color:var(--quiet)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r-btn);overflow:hidden}
.seg button,.btn{font:inherit;font-size:14px;font-weight:500;min-height:40px;padding:8px 12px;border:0;background:var(--bg);color:var(--ink);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.btn{border:1px solid var(--line);border-radius:var(--r-btn);text-decoration:none;display:inline-flex;align-items:center}
.btn:hover,.seg button:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{position:relative;min-height:0;min-width:0;overflow:hidden}
#c{display:block;width:100%;height:100%;touch-action:none}
.hint{position:absolute;left:16px;bottom:16px;font-size:12px;color:var(--quiet);background:var(--bg);border:1px solid var(--line);border-radius:var(--r-btn);padding:4px 8px}
.msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--quiet)}
.label{position:absolute;pointer-events:auto;cursor:pointer;font-family:var(--f-mono);font-size:12px;font-weight:600;padding:4px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--ink);white-space:nowrap;transform:translate(8px,-50%)}
.label[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
aside{border-left:1px solid var(--line);overflow-y:auto;padding:16px 20px 32px;min-height:0}
aside h2{font-size:22px;font-weight:600;margin:0 0 4px}
aside h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--quiet);margin:24px 0 8px;font-weight:600}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:4px 8px;border-radius:999px;background:var(--brand-accent-soft);color:var(--ink);border:1px solid var(--brand-accent)}
.floors{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.floors button{width:100%;text-align:left;font:inherit;display:grid;grid-template-columns:48px 1fr;gap:8px;align-items:center;padding:8px 12px;min-height:44px;border:1px solid var(--line);border-radius:var(--r-btn);background:var(--bg);color:var(--ink);cursor:pointer}
.floors button:hover{border-color:var(--accent)}
.floors button[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.floors .id{font-family:var(--f-mono);font-size:12px;font-weight:600;padding:4px 0;border-radius:var(--r-btn);text-align:center;color:var(--accent-ink)}
.floors .ten{font-weight:600}
.floors small{display:block;font-size:12px;color:var(--quiet);font-weight:400}
.card{border:1px solid var(--line);border-radius:var(--r-card);padding:16px;background:var(--surface)}
.card p{margin:0 0 12px}
.khu{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.khu li{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-btn);padding:8px 12px}
.khu b{display:block;font-family:var(--f-display)}
.note{font-size:12px;color:var(--quiet)}
table{border-collapse:collapse;width:100%;font-size:12px}
td,th{border-bottom:1px solid var(--line);padding:4px 8px 4px 0;text-align:left}
td.n{font-family:var(--f-mono)}
@media (max-width:860px){
  body{overflow:auto}
  .app{display:block;height:auto}
  .stage{height:60vh}
  aside{border-left:0;border-top:1px solid var(--line);padding:16px}
  .tools{margin-left:0}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">Md</div>
      <div><h1>Toà nhà vận hành MdFlexCom</h1>
      <span>7 tầng · mỗi tầng 3 khu · bản nháp 02, chờ duyệt</span></div>
    </div>
    <div class="tools">
      <div class="seg" role="group" aria-label="Chế độ xem" id="modes">
        <button data-mode="gop" aria-pressed="true">Cả toà</button>
        <button data-mode="tach" aria-pressed="false">Tách tầng</button>
        <button data-mode="tang" aria-pressed="false">Từng tầng</button>
      </div>
      <div class="seg" role="group" aria-label="Ngày hoặc đêm" id="themes">
        <button data-theme="ngay" aria-pressed="true">Ngày</button>
        <button data-theme="dem" aria-pressed="false">Đêm</button>
      </div>
      <button class="btn" id="spin" aria-pressed="false">Tự xoay</button>
      <a class="btn" href="/">← Mô hình công ty</a>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="c" aria-label="Mô hình 3D toà nhà 7 tầng"></canvas>
    <div id="labels"></div>
    <div class="msg" id="msg">Đang tải mô hình…</div>
    <div class="hint">Kéo để xoay · cuộn để phóng to · bấm vào một tầng</div>
  </div>

  <aside id="panel"></aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="/co-cau.js"></script>
<script>
(async function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const msg=$("#msg");
if(!window.THREE||!THREE.GLTFLoader){ msg.textContent="Không tải được thư viện 3D. Kiểm tra kết nối mạng rồi tải lại trang."; return; }

let spec;
try{ spec=await (await fetch("/toa-nha/dac-ta-canh.json")).json(); }
catch(e){ msg.textContent="Không đọc được đặc tả cảnh (/toa-nha/dac-ta-canh.json)."; return; }
const PAL=spec.bang_mau, TACH=(spec.toa_do.cao_khi_tach_tang-spec.toa_do.cao_tang);

// Màu ngày trong GLB → khoá bảng màu → màu đêm. #E8F5F1 dùng chung cho stage/mint/glass: coi là mint (bề mặt).
const KHOA={};
for(const [k,v] of Object.entries(PAL.ngay)){ const h=v.toLowerCase(); if(!(h in KHOA) || k==="mint") KHOA[h]=k; }
KHOA["#ffffff"]="tile"; KHOA["#fefefe"]="tile"; // vật liệu không có baseColorFactor = trắng

// ---------- Cảnh ----------
const canvas=$("#c"), stage=$("#stage");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(35,1,0.1,500);
const controls=new THREE.OrbitControls(camera,canvas);
controls.enableDamping=true; controls.maxPolarAngle=Math.PI*0.49; controls.minDistance=8; controls.maxDistance=120;

const loader=new THREE.GLTFLoader();
let gltf;
try{ gltf=await new Promise((ok,err)=>loader.load("/toa-nha/toa-nha-7-tang.glb",ok,undefined,err)); }
catch(e){ msg.textContent="Không tải được mô hình (/toa-nha/toa-nha-7-tang.glb)."; return; }
msg.remove();
const root=gltf.scene; scene.add(root);

const mats=new Set();
root.traverse(o=>{ if(o.isMesh){ (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>mats.add(m)); } });
mats.forEach(m=>{ m.userData.ngay="#"+m.color.clone().convertLinearToSRGB().getHexString(); m.userData.khoa=KHOA[m.userData.ngay]||null; });

// Tầng: node tên "T0x · …"
const floors=[];
// GLTFLoader đổi khoảng trắng trong tên thành "_" nên chỉ so khớp phần đầu "T0x"
root.traverse(o=>{ const m=/^(T0\d)(?!\d)/.exec(o.name||""); if(m && !floors.some(f=>f.id===m[1])) floors.push({id:m[1],node:o,y0:o.position.y}); });
floors.sort((a,b)=>a.id.localeCompare(b.id));
const INFO=Object.fromEntries(spec.tang.map(t=>[t.id,t]));
floors.forEach((f,i)=>{ f.i=i; f.info=INFO[f.id]; f.node.traverse(o=>o.userData.tang=f.id); f.box=new THREE.Box3().setFromObject(f.node); });

// Khung camera
const box=new THREE.Box3().setFromObject(root), size=box.getSize(new THREE.Vector3()), ctr=box.getCenter(new THREE.Vector3());
const R=Math.max(size.x,size.y,size.z);
controls.target.copy(ctr);
camera.position.set(ctr.x+R*1.1,ctr.y+R*0.6,ctr.z+R*1.4);

// ---------- Trạng thái ----------
const S={mode:"gop",theme:matchMedia("(prefers-color-scheme: dark)").matches?"dem":"ngay",sel:null,spin:false};

function applyTheme(){
  document.documentElement.dataset.theme=S.theme==="dem"?"dark":"light";
  const p=PAL[S.theme];
  scene.background=new THREE.Color(p.stage); // r128 không mã hoá sRGB cho màu nền nên giữ nguyên mã màu
  mats.forEach(m=>{ const k=m.userData.khoa; const hex=S.theme==="ngay"?m.userData.ngay:(k&&p[k])||m.userData.ngay; m.color.set(hex).convertSRGBToLinear(); });
  document.querySelectorAll("#themes button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.theme===S.theme)));
  renderPanel();
}

function applyLayout(){
  const one=S.mode==="tang"?(S.sel||"T01"):null;
  if(S.mode==="tang" && !S.sel) S.sel="T01";
  floors.forEach(f=>{
    f.node.position.y=f.y0+(S.mode==="tach"?f.i*TACH:0);
    f.node.visible=!one||f.id===one;
  });
  // Phần chung (sân nền) ẩn khi xem từng tầng
  const floorNodes=new Set(floors.map(f=>f.node));
  floors[0].node.parent.children.forEach(c=>{ if(!floorNodes.has(c)) c.visible=!one; });
  document.querySelectorAll("#modes button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.mode===S.mode)));
  const target=one?floors.find(f=>f.id===one):null;
  const b=new THREE.Box3().setFromObject(target?target.node:root), c=b.getCenter(new THREE.Vector3());
  // Khoảng cách vừa khung: bán kính khối bao / sin(nửa góc nhìn), tính cả màn hình dọc
  const fov=THREE.MathUtils.degToRad(camera.fov)/2, fovH=Math.atan(Math.tan(fov)*camera.aspect);
  const d=(b.getSize(new THREE.Vector3()).length()/2)/Math.sin(Math.min(fov,fovH))*0.95;
  const dir=camera.position.clone().sub(controls.target).normalize();
  controls.target.copy(c); camera.position.copy(c).addScaledVector(dir,d);
  buildLabels(); renderPanel();
}

// ---------- Nhãn tầng ----------
const labelsEl=$("#labels"); let labels=[];
function buildLabels(){
  labelsEl.innerHTML=""; labels=[];
  floors.forEach(f=>{
    if(!f.node.visible) return;
    const el=document.createElement("div"); el.className="label"; el.textContent=f.id;
    el.title=f.info?f.info.ten:f.id; el.setAttribute("aria-current",String(S.sel===f.id));
    el.addEventListener("click",()=>select(f.id));
    labelsEl.appendChild(el); labels.push({el,f});
  });
}
const v=new THREE.Vector3();
function placeLabels(){
  const w=canvas.clientWidth,h=canvas.clientHeight;
  labels.forEach(({el,f})=>{
    const b=new THREE.Box3().setFromObject(f.node);
    v.set(b.max.x,(b.min.y+b.max.y)/2,b.max.z).project(camera);
    el.style.left=((v.x+1)/2*w)+"px"; el.style.top=((1-v.y)/2*h)+"px";
    el.style.display=v.z<1?"":"none";
  });
}

// ---------- Chọn tầng ----------
function select(id){
  S.sel=S.sel===id&&S.mode!=="tang"?null:id;
  if(S.mode==="tang") applyLayout(); else { buildLabels(); renderPanel(); }
}
const ray=new THREE.Raycaster(), ptr=new THREE.Vector2(); let down=null;
canvas.addEventListener("pointerdown",e=>down=[e.clientX,e.clientY]);
canvas.addEventListener("pointerup",e=>{
  if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>5) return;
  const r=canvas.getBoundingClientRect();
  ptr.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
  ray.setFromCamera(ptr,camera);
  const hit=ray.intersectObject(root,true).find(h=>h.object.visible&&h.object.userData.tang);
  if(hit) select(hit.object.userData.tang);
});

// ---------- Bảng bên phải ----------
const COLOR={amber:"amber",teal:"teal",frame:"frame"};
// Tầng → phòng lấy từ trường "tang" trong phong.json của cơ cấu đang dùng (biến CO_CAU)
const CO=window.CO_CAU||null, CO_PHONG=CO?CO.phong.phong:[];
const PHONG_TANG=Object.fromEntries(CO_PHONG.filter(p=>p.tang).map(p=>[p.tang,p.id]));
// Cơ cấu khác MdFlex: tầng đã gắn phòng thì hiện tên, trưởng phòng, tổ của phòng đó thay cho công năng thiết kế MdFlex
if(CO&&!CO.la_mdflex) CO_PHONG.filter(p=>p.tang&&INFO[p.tang]).forEach(p=>{ Object.assign(INFO[p.tang],{ten:p.ten,vai_tro:p.truong_phong.nguoi_that,mo_ta:p.chuc_nang||"",khu:p.to.slice(0,3).map(t=>[t.ten,t.vi_tri.map(v=>v.ten).join("; ")])}); });
function renderPanel(){
  const p=PAL[S.theme], t=S.sel&&INFO[S.sel];
  const list=spec.tang.slice().reverse().map(x=>`<li><button data-id="${x.id}" aria-current="${S.sel===x.id}">
      <span class="id" style="background:${p[COLOR[x.mau]]||p.teal};color:${S.theme==="dem"?p.stage:"#ffffff"}">${x.id}</span>
      <span><span class="ten">${esc(x.ten)}</span><small>${esc(x.vai_tro)}</small></span></button></li>`).join("");
  const chiTiet=t?`<h3>${esc(t.id)} · chi tiết</h3><div class="card"><h2>${esc(t.ten)}</h2><p class="note">${esc(t.vai_tro)}</p><p>${esc(t.mo_ta)}</p>
      <ul class="khu">${t.khu.map(([a,b],i)=>`<li><b>Khu ${"ABC"[i]} · ${esc(a)}</b>${esc(b)}</li>`).join("")}</ul>
      ${PHONG_TANG[t.id]?`<p style="margin:12px 0 0"><a class="btn" style="background:var(--accent);border-color:var(--accent);color:var(--accent-ink)" href="/phong.html?id=${PHONG_TANG[t.id]}">Mở trang làm việc của phòng →</a></p>`:""}</div>`
    :`<h3>Chi tiết</h3><p class="note">Chọn một tầng trong danh mục hoặc bấm vào mô hình để xem công năng.</p>`;
  const m=spec.moc_nhan_su_ke_hoach;
  $("#panel").innerHTML=`<span class="badge">${esc(spec.phien_ban)}</span>
    ${CO&&!CO.la_mdflex?`<p class="note">Toà nhà 7 tầng là thiết kế cho MdFlex. Cơ cấu ${esc(CO.ten)} ${Object.keys(PHONG_TANG).length?"đã gắn "+Object.keys(PHONG_TANG).length+" phòng vào tầng":"chưa gắn phòng nào vào tầng"} (trường tang trong config/co-cau/${esc(CO.id)}/phong.json).</p>`:""}<h3>Danh mục tầng</h3><ul class="floors">${list}</ul>${chiTiet}
    <h3>Mốc nhân sự kế hoạch</h3>
    <table><tr><th>Thành lập</th><th>G0</th><th>G1</th><th>G2</th><th>G3</th></tr>
    <tr><td class="n">${m.thanh_lap}</td><td class="n">${m.G0}</td><td class="n">${m.G1}</td><td class="n">${m.G2}</td><td class="n">${m.G3}</td></tr></table>
    <p class="note">${esc(m.ghi_chu)}</p>
    <h3>Giả định</h3><p class="note">${esc(spec.gia_dinh)}</p>
    <p class="note">Màu đã đưa về bảng màu thương hiệu: ${spec.dieu_chinh_mau?spec.dieu_chinh_mau.danh_sach.length:0} điều chỉnh, xem thiet-ke/toa-nha-7-tang/README.md.</p>`;
}
$("#panel").addEventListener("click",e=>{ const b=e.target.closest("button[data-id]"); if(b) select(b.dataset.id); });
$("#modes").addEventListener("click",e=>{ const b=e.target.closest("button[data-mode]"); if(!b) return; S.mode=b.dataset.mode; applyLayout(); });
$("#themes").addEventListener("click",e=>{ const b=e.target.closest("button[data-theme]"); if(!b) return; S.theme=b.dataset.theme; applyTheme(); });
$("#spin").addEventListener("click",e=>{ S.spin=!S.spin; e.currentTarget.setAttribute("aria-pressed",String(S.spin)); controls.autoRotate=S.spin; });

// ---------- Vòng lặp ----------
function resize(){ const w=stage.clientWidth,h=stage.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
resize(); applyTheme(); applyLayout();
new ResizeObserver(resize).observe(stage);
(function loop(){ controls.update(); renderer.render(scene,camera); placeLabels(); requestAnimationFrame(loop); })();
window.__toaNha={floors:floors.map(f=>f.id),mats:[...mats].map(m=>[m.userData.ngay,m.userData.khoa])};
})();
</script>
</body>
</html>
